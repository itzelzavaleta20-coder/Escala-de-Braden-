<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escala de Braden - Selección visual</title>
  <style>
    :root {
      --bg: #edf4ff;
      --panel: #ffffff;
      --text: #1d2a36;
      --muted: #5f6f7f;
      --primary: #1f6feb;
      --primary-dark: #164fa3;
      --border: #dfe7f1;
      --shadow: 0 14px 35px rgba(17, 57, 103, 0.12);
      --blue-soft: #eaf3ff;
      --blue-border: #9cc2ff;
      --blue-text: #184d99;
      --green-soft: #e8f9ee;
      --green-border: #9dd7b4;
      --green-text: #1f6b42;
      --yellow-soft: #fff6d8;
      --yellow-border: #f0d16b;
      --yellow-text: #7a5600;
      --orange-soft: #fff0dc;
      --orange-border: #f7c16b;
      --orange-text: #8b5300;
      --red-soft: #ffe5e3;
      --red-border: #f0a09a;
      --red-text: #8d1f17;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #edf4ff 0%, #f7f9fc 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      width: min(1100px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 22px 26px;
    }

    .title {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #0d5bd7, #5aa6ff, #0d5bd7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 10px;
      line-height: 1.5;
    }

    .categories {
      display: grid;
      gap: 22px;
      margin-top: 26px;
    }

    .category {
      border: 1px solid var(--border);
      background: #f9fbff;
      border-left: 6px solid var(--primary);
      border-radius: 16px;
      padding: 18px;
    }

    .category-header {
      margin-bottom: 14px;
      font-weight: 800;
      font-size: 1.08rem;
      color: var(--text);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .option {
      position: relative;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 12px 12px 10px;
      cursor: pointer;
      transition: 0.2s ease;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .option:hover {
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(31, 111, 235, 0.08);
      transform: translateY(-1px);
    }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .option.selected {
      border-color: var(--primary);
      background: var(--blue-soft);
      box-shadow: inset 0 0 0 1px rgba(31,111,235,.08);
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .score-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #6ba9ff);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
    }

    .option-text {
      color: var(--text);
      font-size: 0.94rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 14px 26px;
      font-size: 1rem;
      font-weight: 700;
      transition: 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-calc {
      background: linear-gradient(135deg, var(--primary), #61a9ff);
      color: white;
      box-shadow: 0 10px 20px rgba(31, 111, 235, 0.2);
    }

    .btn-reset {
      background: #eef3fb;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result {
      display: none;
      margin-top: 22px;
      border-radius: 14px;
      padding: 18px 16px;
      font-size: 1.04rem;
      line-height: 1.6;
      font-weight: 700;
      text-align: center;
      border: 1px solid transparent;
    }

    .result.visible { display: block; }

    .result.no-risk {
      background: var(--blue-soft);
      border-color: var(--blue-border);
      color: var(--blue-text);
    }

    .result.low {
      background: var(--green-soft);
      border-color: var(--green-border);
      color: var(--green-text);
    }

    .result.moderate {
      background: var(--yellow-soft);
      border-color: var(--yellow-border);
      color: var(--yellow-text);
    }

    .result.high {
      background: var(--orange-soft);
      border-color: var(--orange-border);
      color: var(--orange-text);
    }

    .result.very-high {
      background: var(--red-soft);
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .legend {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.7;
    }

    .legend strong { color: var(--text); }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 0.87rem;
    }

    .chip.no-risk { background: var(--blue-soft); border-color: var(--blue-border); color: var(--blue-text); }
    .chip.low { background: var(--green-soft); border-color: var(--green-border); color: var(--green-text); }
    .chip.moderate { background: var(--yellow-soft); border-color: var(--yellow-border); color: var(--yellow-text); }
    .chip.high { background: var(--orange-soft); border-color: var(--orange-border); color: var(--orange-text); }
    .chip.very-high { background: var(--red-soft); border-color: var(--red-border); color: var(--red-text); }

    @media (max-width: 680px) {
      .container { padding: 20px 14px 18px; }
      .options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <h1>Escala de Braden</h1>
      <div class="subtitle">Selecciona la puntuación de cada categoría; todas las opciones aparecen visibles con su descripción para facilitar la valoración.</div>
    </div>

    <div id="categories" class="categories"></div>

    <div class="actions">
      <button type="button" class="btn-calc" id="calcBtn">Calcular riesgo</button>
      <button type="button" class="btn-reset" id="resetBtn">Reiniciar</button>
    </div>

    <div id="result" class="result"></div>

    <div class="legend">
      <strong>Interpretación:</strong>
      <div class="legend-row">
        <span class="chip no-risk">19–23: Sin riesgo</span>
        <span class="chip low">15–18: Riesgo leve</span>
        <span class="chip moderate">13–14: Riesgo moderado</span>
        <span class="chip high">10–12: Riesgo alto</span>
        <span class="chip very-high">9 o menos: Riesgo muy alto</span>
      </div>
    </div>
  </div>

  <script>
    const categories = [
      {
        label: '1. Percepción sensorial',
        key: 'sensory',
        max: 4,
        options: {
          1: 'Completamente limitada',
          2: 'Muy limitada',
          3: 'Ligeramente limitada',
          4: 'Sin limitaciones'
        }
      },
      {
        label: '2. Exposición a la humedad',
        key: 'humidity',
        max: 4,
        options: {
          1: 'Constantemente húmedo',
          2: 'Muy húmedo',
          3: 'Ligeramente húmedo',
          4: 'Raramente húmedo'
        }
      },
      {
        label: '3. Nivel de actividad',
        key: 'activity',
        max: 4,
        options: {
          1: 'Encamado',
          2: 'En silla',
          3: 'Camina con ayuda',
          4: 'Camina libremente'
        }
      },
      {
        label: '4. Movilidad',
        key: 'mobility',
        max: 4,
        options: {
          1: 'Completamente inmóvil',
          2: 'Muy limitado',
          3: 'Ligeramente limitado',
          4: 'Sin limitaciones'
        }
      },
      {
        label: '5. Estado nutricional',
        key: 'nutrition',
        max: 4,
        options: {
          1: 'Muy pobre',
          2: 'Probablemente inadecuada',
          3: 'Adecuada',
          4: 'Excelente'
        }
      },
      {
        label: '6. Fricción y cizalla',
        key: 'friction',
        max: 3,
        options: {
          1: 'Requiere ayuda para moverse',
          2: 'Se mueve débilmente y necesita ayuda',
          3: 'Se moviliza de forma independiente'
        }
      }
    ];

    const categoriesContainer = document.getElementById('categories');
    const resultBox = document.getElementById('result');

    function buildCategories() {
      categories.forEach((category) => {
        const card = document.createElement('div');
        card.className = 'category';

        const title = document.createElement('div');
        title.className = 'category-header';
        title.textContent = category.label;
        card.appendChild(title);

        const optionsWrap = document.createElement('div');
        optionsWrap.className = 'options';

        Object.keys(category.options).forEach((value) => {
          const option = document.createElement('label');
          option.className = 'option';
          option.dataset.category = category.key;
          option.dataset.value = value;

          const input = document.createElement('input');
          input.type = 'radio';
          input.name = category.key;
          input.value = value;

          const row = document.createElement('div');
          row.className = 'score-row';

          const badge = document.createElement('span');
          badge.className = 'score-badge';
          badge.textContent = value;

          const check = document.createElement('span');
          check.textContent = '✓';
          check.style.opacity = '0';
          check.style.fontWeight = '900';
          check.style.color = 'var(--primary)';

          row.appendChild(badge);
          row.appendChild(check);

          const text = document.createElement('div');
          text.className = 'option-text';
          text.textContent = category.options[value];

          option.appendChild(input);
          option.appendChild(row);
          option.appendChild(text);

          option.addEventListener('click', () => {
            document.querySelectorAll(`input[name="${category.key}"]`).forEach((el) => {
              const parent = el.closest('.option');
              parent.classList.remove('selected');
              if (el.checked) {
                parent.querySelector('span:last-child')?.style.setProperty('opacity', '0');
              }
            });

            input.checked = true;
            option.classList.add('selected');
            option.querySelector('span:last-child').style.opacity = '1';
          });

          optionsWrap.appendChild(option);
        });

        card.appendChild(optionsWrap);
        categoriesContainer.appendChild(card);
      });
    }

    function interpretRisk(total) {
      if (total >= 19 && total <= 23) return { text: 'No hay riesgo', className: 'no-risk' };
      if (total >= 15 && total <= 18) return { text: 'Riesgo leve', className: 'low' };
      if (total >= 13 && total <= 14) return { text: 'Riesgo moderado', className: 'moderate' };
      if (total >= 10 && total <= 12) return { text: 'Riesgo alto', className: 'high' };
      return { text: 'Riesgo muy alto', className: 'very-high' };
    }

    function calculateRisk() {
      let total = 0;
      categories.forEach((category) => {
        const checked = document.querySelector(`input[name="${category.key}"]:checked`);
        if (checked) total += Number(checked.value);
      });

      const risk = interpretRisk(total);
      resultBox.className = `result visible ${risk.className}`;
      resultBox.innerHTML = `<div>Puntuación total: <strong>${total}</strong></div><div>Clasificación: <strong>${risk.text}</strong></div>`;
    }

    function resetForm() {
      document.querySelectorAll('input[type="radio"]').forEach((el) => {
        el.checked = false;
      });
      document.querySelectorAll('.option').forEach((el) => el.classList.remove('selected'));
      resultBox.className = 'result';
      resultBox.innerHTML = '';
    }

    document.getElementById('calcBtn').addEventListener('click', calculateRisk);
    document.getElementById('resetBtn').addEventListener('click', resetForm);

    buildCategories();
  </script>
</body>
</html>
